name: Publish versioned release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test release and metrics tooling
        run: npm test

      - name: Build the downloadable package
        run: npm run package:release -- "$GITHUB_REF_NAME"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.zip \
            release/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Ellivien PulseTap $GITHUB_REF_NAME"
